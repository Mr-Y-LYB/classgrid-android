plugins { id 'com.android.application' }

def signingFile = file('../.signing/signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.mrylyb.classgrid'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mrylyb.classgrid'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '2.1.0'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file('../.signing/classgrid.jks')
                storePassword signing.getProperty('password')
                keyAlias 'classgrid'
                keyPassword signing.getProperty('password')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
}

def changelogSource = rootProject.file('CHANGELOG.md')
def changelogAsset = file('src/main/assets/changelog.js')
def verifyChangelog = tasks.register('verifyChangelog') {
    inputs.file(changelogSource)
    inputs.file(changelogAsset)
    doLast {
        def prefix = 'window.CG_CHANGELOG='
        def payload = changelogAsset.getText('UTF-8').trim()
        if (!payload.startsWith(prefix) || !payload.endsWith(';')
            || new groovy.json.JsonSlurper().parseText(payload.substring(prefix.length(), payload.length() - 1)) != changelogSource.getText('UTF-8'))
            throw new GradleException('应用内更新说明与 CHANGELOG.md 不一致，请同步 changelog.js')
    }
}
tasks.matching { it.name == 'mergeDebugAssets' || it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn verifyChangelog
}

